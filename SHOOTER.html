<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10172b">
<title>REDCORE — Shooter</title>
<style>
:root{color-scheme:dark;--ink:#f4f7ff;--muted:#a8b4d0;--panel:#121d36;--line:#33496f;--accent:#66d9ff;--pink:#ff78bd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10172b;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:2;top:env(safe-area-inset-top,10px);left:0;right:0;padding:12px clamp(12px,3vw,28px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font-size:clamp(11px,1.5vw,14px);letter-spacing:.22em;font-weight:900;color:#d9f7ff;text-shadow:0 0 18px #56cfff88}
.stats{display:flex;gap:8px}.pill{background:#0b1428c9;border:1px solid #86caff55;border-radius:14px;padding:7px 12px;min-width:76px;text-align:center;backdrop-filter:blur(12px)}
.pill small{display:block;color:var(--muted);font-size:9px;letter-spacing:.15em}.pill strong{font-size:clamp(14px,2vw,20px);font-variant-numeric:tabular-nums}
.controls{position:fixed;z-index:3;right:clamp(12px,3vw,26px);top:calc(env(safe-area-inset-top,10px) + 66px);display:flex;gap:8px}
button{font:inherit;color:var(--ink);background:#152746dd;border:1px solid #7bdcff66;border-radius:12px;padding:10px 14px;font-weight:750;backdrop-filter:blur(10px);cursor:pointer}
button:active{transform:scale(.97)}button.primary{background:linear-gradient(135deg,#267da7,#5b56a8);border-color:#a8eaff}
#overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#080e1dc9;backdrop-filter:blur(9px);padding:20px}
.panel{width:min(440px,92vw);padding:clamp(22px,5vw,34px);border:1px solid #8bdfff66;border-radius:24px;background:linear-gradient(145deg,#1b2b49f2,#111a31f5);box-shadow:0 24px 90px #0009;text-align:center}
.panel h1{margin:0 0 8px;font-size:clamp(25px,6vw,40px);letter-spacing:.05em}.panel p{color:var(--muted);line-height:1.5;margin:8px 0 22px}.panel .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hint{position:fixed;z-index:2;bottom:calc(env(safe-area-inset-bottom,8px) + 12px);left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:99px;background:#0b1428b8;border:1px solid #86caff44;color:#d5eaff;font-size:clamp(10px,2.5vw,13px);white-space:nowrap;pointer-events:none}
#aim{position:fixed;z-index:2;width:32px;height:32px;border:1px solid #d9f8ffb0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;box-shadow:0 0 14px #66d9ff99}
#aim:before,#aim:after{content:"";position:absolute;background:#d9f8ffb0;left:50%;top:50%;transform:translate(-50%,-50%)}#aim:before{width:46px;height:1px}#aim:after{height:46px;width:1px}
@media(orientation:portrait){.stats{gap:5px}.pill{min-width:62px;padding:6px 8px}.controls{top:calc(env(safe-area-inset-top,10px) + 62px)}}
#passwordGate{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,#20365de8,#070c18f7 72%);backdrop-filter:blur(18px)}
#passwordGate .panel{width:min(390px,92vw)}
#passwordGate .lock-mark{width:54px;height:54px;margin:0 auto 16px;border:1px solid #78dcff88;border-radius:17px;display:grid;place-items:center;color:#8ce7ff;font-size:25px;box-shadow:0 0 28px #48caff24}
#gamePassword{display:block;width:100%;margin:0 0 12px;padding:15px 16px;border:1px solid #80dfff88;border-radius:13px;background:#071329;color:#fff;text-align:center;font:800 24px/1.2 system-ui;letter-spacing:.45em;outline:none}
#gamePassword:focus{border-color:#a9f0ff;box-shadow:0 0 0 3px #66d9ff22}
#passwordError{min-height:22px;margin:0 0 10px!important;color:#ff8ebd!important;font-size:13px}
#passwordGate .actions button{min-width:150px}

</style>
</head>
<body>
<canvas id="game" aria-label="Shooter game area"></canvas>
<div class="hud"><div class="brand">REDCORE / SHOOTER</div><div class="stats"><div class="pill"><small>SCORE</small><strong id="score">0</strong></div><div class="pill"><small>BEST</small><strong id="best">0</strong></div><div class="pill"><small>ROUND</small><strong id="round">1</strong></div></div></div>
<div class="controls"><button id="pause">Ⅱ</button><button id="exit">EXIT</button></div>
<div class="hint" id="hint">Tap to shoot</div><div id="aim"></div>
<div id="overlay"><div class="panel"><h1>SHOOTER</h1><p>A sleepy-night arcade challenge. Hit the flying stickman targets as they fly across the room. Only one target enters at a time.</p><div class="actions"><button class="primary" id="start">START GAME</button></div></div></div>
<div id="passwordGate" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
  <div class="panel">
    <div class="lock-mark" aria-hidden="true">⌑</div>
    <h1 id="passwordTitle">ACCESS LOCKED</h1>
    <p>Enter the 4-digit access code to enter SHOOTER.</p>
    <form id="passwordForm">
      <input id="gamePassword" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Four digit password" placeholder="••••" required>
      <p id="passwordError" aria-live="polite"></p>
      <div class="actions"><button class="primary" type="submit">UNLOCK GAME</button></div>
    </form>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const gate=$('passwordGate'),passwordInput=$('gamePassword'),passwordError=$('passwordError');
passwordInput.focus();
$('passwordForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(passwordInput.value==='5600'){
    gate.style.display='none';
    passwordError.textContent='';
  }else{
    passwordError.textContent='Incorrect password. Try again.';
    passwordInput.value='';
    passwordInput.focus();
  }
});
passwordInput.addEventListener('input',()=>{passwordInput.value=passwordInput.value.replace(/[^0-9]/g,'').slice(0,4);});

function readProfileStats(){try{return JSON.parse(localStorage.getItem(PROFILE_STATS_KEY)||'{}')||{};}catch(e){return {};}}
function saveShooterBest(value){
 const next=Math.max(0,Number(value)||0);
 try{
  localStorage.setItem(SHOOTER_BEST_KEY,String(next));
  const stats=readProfileStats();
  stats.shooter={...(stats.shooter||{}),name:'SHOOTER',highScore:next,updatedAt:Date.now()};
  localStorage.setItem(PROFILE_STATS_KEY,JSON.stringify(stats));
  window.dispatchEvent(new CustomEvent('redcore:profile-stats-updated',{detail:stats}));
 }catch(e){console.warn('Could not save Shooter record:',e);}
}

 if(target)drawStickTarget(target);
 drawShots();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/34);ctx.fillStyle='#8ceaff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
 if(paused){ctx.fillStyle='#08101d88';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='800 32px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);}
}
function frame(now){const dt=Math.min(2,(now-last)/16.67||1);last=now;update(dt);draw(now);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
function start(){score=0;round=1;target=null;shots=[];particles=[];spawnTimer=.25;paused=false;running=true;gameOver=false;$('score').textContent='0';$('round').textContent='1';$('overlay').style.display='none';$('pause').textContent='Ⅱ';}
$('start').addEventListener('click',start);
$('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';});
$('exit').addEventListener('click',()=>{running=false;paused=false;$('overlay').style.display='grid';$('overlay').querySelector('h1').textContent='GAME PAUSED';$('overlay').querySelector('p').textContent='Your run has ended. Start again whenever you are ready.';$('start').textContent='PLAY AGAIN';});
function setPointer(e){const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.active=true;$('aim').style.display='block';$('aim').style.left=e.clientX+'px';$('aim').style.top=e.clientY+'px';}
canvas.addEventListener('pointerdown',e=>{setPointer(e);shoot(pointer.x,pointer.y);canvas.setPointerCapture?.(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(fire||e.pointerType==='mouse')setPointer(e);});
addEventListener('pointerup',()=>{fire=false;});
addEventListener('pointercancel',()=>{fire=false;});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();shoot(pointer.active?pointer.x:W*.72,pointer.active?pointer.y:H*.35);}if(e.code==='Escape'){$('pause').click();}});
addEventListener('keyup',e=>{if(e.code==='Space')fire=false;});
})();
</script>
<script type="module" src="./game-tracker.js"></script>
